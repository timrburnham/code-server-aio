apiVersion: v1
kind: Namespace
metadata:
  name: code-server
  labels:
    # This workload runs privileged for Docker-in-Docker.
    # Pinning enforce=privileged keeps it that way even if the cluster
    # later adds namespace-wide Pod Security Admission defaults.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
